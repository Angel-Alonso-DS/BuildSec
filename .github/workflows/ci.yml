name: BuildSys CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate kit and code
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s tests -v
          git diff --check
# Este flujo NO ejecuta Codex ni código generado por IA. Adaptar al stack y a runners aislados.
